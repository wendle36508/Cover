<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Fraunces:ital,opsz,wght,SOFT@1,144,460,100&family=Space+Grotesk:wght@700&display=swap">

<style>
  /* My sponsorships (approved mockup, Nov 25, 2026): everyone they sponsor, their updates, certificates and receipts. */
  .linkbtn { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; }
  #content { padding-bottom: 96px; }
  .hello { padding: 64px 0 48px; }
  .hello h1 { font-size: 56px; }
  .hello .lead { margin-top: 16px; }
  .hello .signed { margin-top: 8px; font-size: 14px; color: var(--ink-soft); }
  .mine { display: grid; grid-template-columns: repeat(2, 1fr); gap: 48px; }
  .one { display: grid; grid-template-columns: 200px 1fr; gap: 24px; border-top: 1px solid var(--line); padding-top: 24px; }
  .one > img, .one > .noimg { width: 100%; height: 100%; min-height: 240px; object-fit: cover; background: var(--sage); }
  .one .w { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .one h3 { font-size: 28px; overflow-wrap: anywhere; }
  .one .org { color: var(--ink-soft); font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill.warn { background: #F3E3C3; color: #5C4310; }
  .pill.ended { background: var(--line); color: var(--ink-soft); }
  .one .facts { display: flex; gap: 24px; flex-wrap: wrap; margin: 8px 0; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .one .facts b { display: block; font-family: "Space Grotesk", sans-serif; font-size: 22px; letter-spacing: -.018em; }
  .one .facts span { font-size: 13px; color: var(--ink-soft); }
  .one .links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: auto; }
  .one .links button { font-family: inherit; font-size: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .notice { padding: 12px 16px; font-size: 15px; margin-top: 16px; }
  .notice.warn { background: #F3E3C3; color: #5C4310; }
  .notice.bad { background: #F6DED6; color: #7A2A18; }
  .notice.ok { background: var(--sage); color: var(--deep); }
  .manage { grid-column: 1 / -1; padding: 32px; background: var(--paper); border-top: 2px solid var(--moss); }
  .manage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .manage-head h3 { font-size: 28px; }
  .manage .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
  .manage .grid div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
  .manage .grid small { display: block; font-size: 13px; color: var(--ink-soft); }
  .manage .grid b { display: block; font-size: 16px; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 24px; }
  .actions .btn { padding: 12px 16px; font-size: 15px; }
  .linklike { font: inherit; font-size: 14px; color: var(--ink-soft); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
  .switches { display: grid; gap: 8px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 15px; }
  .switch input { width: 40px; height: 22px; accent-color: var(--moss); cursor: pointer; }
  .box { margin-top: 16px; padding: 24px; background: var(--cream); }
  .box h3 { font-size: 18px; }
  .box p { color: var(--ink-soft); font-size: 15px; margin-top: 8px; }
  .amount-row { display: flex; gap: 16px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .amount-row label { position: relative; }
  .amount-row label::before { content: "$"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
  .amount-row input { font: inherit; font-size: 17px; width: 130px; padding: 12px 12px 12px 28px; border: 1px solid var(--line); background: var(--paper); }
  .amount-row input:focus { outline: 2px solid var(--moss); outline-offset: 0; }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-top: 16px; }
  .choice { border: 1px solid var(--line); background: var(--paper); text-align: left; font: inherit; cursor: pointer; padding: 0; }
  .choice img, .choice .noimg { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--sage); }
  .choice b { display: block; padding: 8px; font-size: 15px; }
  .choice.current { border-color: var(--moss); outline: 1px solid var(--moss); }
  .error { color: #B2321F; font-size: 14px; margin-top: 8px; }
  .feed { max-width: 760px; margin-top: 32px; border-top: 1px solid var(--line); }
  .post { display: grid; grid-template-columns: 160px 1fr; gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--line); }
  .post img, .post .noimg { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--sage); }
  .post .who { font-size: 14px; color: var(--moss); font-weight: 600; margin-bottom: 8px; }
  .post p { font-size: 17px; line-height: 1.55; }
  .post .when { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
  .quiet { color: var(--ink-soft); margin-top: 24px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
  .two h3 { font-size: 32px; }
  .certs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
  .cert { display: block; background: var(--paper); border: 1px solid var(--line); padding: 16px; text-align: center; text-decoration: none; color: inherit; }
  .cert img, .cert .noimg { display: block; width: 100%; height: 96px; object-fit: cover; background: var(--sage); }
  .cert i { display: block; font-family: "Fraunces", serif; font-style: italic; font-size: 18px; color: var(--moss); margin-top: 8px; }
  .cert span { font-size: 13px; color: var(--ink-soft); }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 15px; }
  td, th { text-align: left; padding: 12px 8px 12px 0; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  td:last-child, th:last-child { text-align: right; padding-right: 0; }
  td a { color: var(--moss); font-weight: 600; text-decoration: none; }
  .panel { background: var(--paper); border: 1px solid var(--line); padding: 32px; margin-top: 24px; }
  .panel.signin { max-width: 520px; margin: 64px auto 0; }
  .panel h1 { font-size: 36px; }
  .panel .lead { font-size: 17px; margin-top: 8px; }
  @media (max-width: 860px) {
    .hello { padding: 40px 0 32px; }
    .hello h1 { font-size: 36px; }
    .mine, .two { grid-template-columns: 1fr; }
    .two { gap: 48px; }
    .one { grid-template-columns: 1fr; }
    .one > img, .one > .noimg { min-height: 0; height: 240px; }
    .manage { padding: 24px 16px; margin-top: -24px; }
    .manage .grid { grid-template-columns: 1fr 1fr; }
    .post { grid-template-columns: 96px 1fr; gap: 16px; }
    .panel { padding: 24px 16px; }
    .panel h1 { font-size: 30px; }
  }
</style>
