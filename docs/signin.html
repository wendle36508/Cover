<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Cover</title>
<link rel="icon" href="brand/icon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="brand/icon-180.png">
<link rel="stylesheet" href="css/cover.css">
<style>
  body { background: var(--soft); }
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 40px 36px; width: min(440px, 100%); }
  .box img.logo { height: 28px; margin-bottom: 28px; }
  .box h1 { font-size: 30px; letter-spacing: -.03em; }
  .box p { color: var(--body); margin-top: 8px; }
  form { margin-top: 26px; }
  .sent { text-align: center; }
  .sent .check { width: 56px; height: 56px; margin: 0 auto 18px; }
  .sent .check svg { width: 30px; }
  .sent form { text-align: left; }
  .error { color: #B2321F; font-size: 14px; margin-top: 10px; min-height: 1em; }
  .notice { background: #FFF6E5; border: 1px solid #F0D9A8; color: #6B4A10; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 22px; }
  .small { font-size: 13px; color: var(--muted); margin-top: 18px; }
  #code { font-size: 22px; letter-spacing: .3em; text-align: center; }
  .agree { font-size: 14px; margin: 4px 0 14px; }
  .agree a { color: var(--green-dark); text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <img class="logo" src="brand/logo.png" alt="Cover">
    <div class="notice" id="problem" role="alert" hidden></div>
    <div id="ask">
      <h1>Sign in to Cover</h1>
      <p>New or returning, just enter your email. We'll send you a link to sign in. No password needed.</p>
      <form id="signin-form" novalidate>
        <div class="field-group">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <label class="toggle agree"><input type="checkbox" id="agree" name="agree"> <span>I agree to Cover's <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="send">Email me a sign-in link</button>
        <div class="error" id="error" role="alert"></div>
      </form>
      <p class="small">Running a nonprofit? After you sign in, you'll set up your sponsor page in a few minutes.</p>
    </div>
    <div class="sent" id="sent" hidden>
      <div class="check" data-check></div>
      <h1>Check your email</h1>
      <p>We sent a sign-in link to <strong id="sent-to"></strong>. Tap it on any device. It works for one hour.</p>
      <form id="code-form" novalidate>
        <div class="field-group">
          <label for="code">Or type the code from the email</label>
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="verify">Sign in with code</button>
        <div class="error" id="code-error" role="alert"></div>
      </form>
      <button class="link-btn" type="button" id="again">Use a different email</button>
    </div>
  </div>
</div>
<script type="module">
  import { problemMessage } from "./js/auth-link.js";
  import { rememberTermsAgreement, TERMS_VERSION } from "./js/terms.js";
  import { pageUrl, supabase } from "./js/supabase.js";

  const CHECK = '<svg viewBox="0 0 24 24"><polyline points="5,12.5 10,17 19,7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  document.querySelectorAll("[data-check]").forEach((el) => (el.innerHTML = CHECK));
  const $ = (id) => document.getElementById(id);
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const CODE = /^\d{6,10}$/;
  let sentTo = "";

  // Sent back here because a sign-in link didn't work? Say why, plainly.
  const problem = problemMessage(new URLSearchParams(location.search).get("problem"));
  if (problem) {
    $("problem").textContent = problem;
    $("problem").hidden = false;
    history.replaceState(null, "", location.pathname);
  }

  // Already signed in? Go straight to the dashboard.
  const { data } = await supabase.auth.getSession();
  if (data.session) location.replace(pageUrl("dashboard.html"));

  $("signin-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = $("email").value.trim().toLowerCase();
    $("error").textContent = "";
    if (!EMAIL.test(email)) {
      $("error").textContent = "That email doesn't look right.";
      $("email").focus();
      return;
    }
    if (!$("agree").checked) {
      $("error").textContent = "Check the box to agree to the Terms of Service first.";
      $("agree").focus();
      return;
    }
    // Remember the agreement: saved on the account for new people, and recorded once signed in.
    rememberTermsAgreement();
    $("send").disabled = true;
    $("send").textContent = "Sending…";
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: pageUrl("dashboard.html"),
        shouldCreateUser: true,
        data: { terms_version: TERMS_VERSION, terms_accepted_at: new Date().toISOString() },
      },
    });
    $("send").disabled = false;
    $("send").textContent = "Email me a sign-in link";
    if (error) {
      $("error").textContent = error.status === 429
        ? "Too many sign-in emails just now. Wait a minute and try again."
        : "We couldn't send the email. Check the address and try again.";
      return;
    }
    sentTo = email;
    $("sent-to").textContent = email;
    $("problem").hidden = true;
    $("ask").hidden = true;
    $("sent").hidden = false;
  });

  // Backup: type the code from the email instead of tapping the link.
  $("code-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const token = $("code").value.replace(/\s/g, "");
    $("code-error").textContent = "";
    if (!CODE.test(token)) {
      $("code-error").textContent = "Type the number code from the email.";
      $("code").focus();
      return;
    }
    $("verify").disabled = true;
    $("verify").textContent = "Checking…";
    const { error } = await supabase.auth.verifyOtp({ email: sentTo, token, type: "email" });
    if (!error) {
      location.replace(pageUrl("dashboard.html"));
      return;
    }
    $("verify").disabled = false;
    $("verify").textContent = "Sign in with code";
    $("code-error").textContent = "That code didn't work. It may have expired, or a newer email replaced it.";
  });

  $("again").addEventListener("click", () => {
    $("sent").hidden = true;
    $("ask").hidden = false;
    $("code").value = "";
    $("email").focus();
  });
</script>
</body>
</html>
