<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your certificate | Cover</title>
<link rel="icon" href="brand/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/cover.css">
<style>
  /* A sponsor's photo certificate: one landscape letter page. The buttons at the top don't print. */
  @page { size: letter landscape; margin: 0.4in; }
  body { background: var(--soft); }
  .tools { max-width: 10in; margin: 0 auto; padding: 18px 16px 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .tools p { color: var(--muted); font-size: 14px; }
  .sheet { width: min(10in, calc(100% - 32px)); margin: 14px auto 40px; background: #fff; border-radius: 18px; box-shadow: 0 10px 40px rgba(20,24,28,.08);
    display: grid; grid-template-columns: 1fr 1.15fr; overflow: hidden; border: 10px solid var(--mint); }
  .photo { width: 100%; height: 100%; min-height: 3.5in; object-fit: cover; background: var(--mint); }
  .words { padding: 0.55in 0.5in; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .org { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 18px; }
  .org img { height: 46px; max-width: 120px; object-fit: contain; }
  .title { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--green-dark); margin-top: 26px; }
  .intro { color: var(--body); font-size: 17px; margin-top: 18px; }
  .holder { font-size: 44px; line-height: 1.05; letter-spacing: -.03em; margin-top: 6px; overflow-wrap: anywhere; }
  .rule { width: 60%; height: 3px; border-radius: 3px; background: var(--green); margin: 14px 0 10px; }
  .line { font-size: 21px; color: var(--ink); font-weight: 650; }
  .date { color: var(--body); font-size: 16px; margin-top: 8px; }
  .gift { color: var(--body); font-size: 15px; font-style: italic; margin-top: 4px; }
  .thanks { color: var(--body); font-size: 15px; margin-top: 22px; max-width: 34ch; }
  .foot { margin-top: auto; padding-top: 24px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .foot img { height: 14px; }
  .problem { max-width: 520px; margin: 60px auto; text-align: center; color: var(--body); padding: 0 16px; }
  @media (max-width: 720px) {
    .sheet { grid-template-columns: 1fr; border-width: 6px; }
    .photo { min-height: 0; aspect-ratio: 4 / 3; }
    .words { padding: 28px 20px; }
    .holder { font-size: 34px; }
  }
  @media print {
    body { background: #fff; }
    .tools { display: none; }
    .sheet { margin: 0 auto; box-shadow: none; width: 100%; height: 7.6in; grid-template-columns: 1fr 1.15fr; }
    .photo { min-height: 0; aspect-ratio: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="tools" id="tools" hidden><p>Tip: to save it, pick "Save as PDF" when the print window opens.</p><button class="btn btn-primary" type="button" id="print">Print or save</button></div>
<main id="certificate"><p class="problem" role="status">Loading…</p></main>
<script type="module" src="js/certificate.js"></script>
</body>
</html>
